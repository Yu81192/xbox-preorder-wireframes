<style>
  html,body{margin:0;height:100%;background:#1E1E1E;color:#E8E8E8;
    font-family:Inter,-apple-system,"Segoe UI",Arial,sans-serif}
  #bar{height:52px;display:flex;align-items:center;gap:14px;padding:0 18px;
    background:#111;border-bottom:1px solid #333;font-size:13px}
  #group{color:#9BD49B;font-weight:600}

    padding:7px 12px;font-size:13px;cursor:pointer}

  #stage{position:relative;width:100%;height:calc(100% - 52px);overflow:hidden}
  #screen{position:absolute;top:0;left:0;transform-origin:top left;
    width:1440px;height:1024px;background:#fff}
  .hot{position:absolute;cursor:pointer;border-radius:6px;background:transparent}
  .hot:hover{background:rgba(16,124,16,.12);outline:2px solid rgba(16,124,16,.55)}
  #hint{position:fixed;right:16px;bottom:12px;font-size:12px;color:#7A7A7A}
</style></head>

let order = [], cur = null;
function show(id, push) {
  const s = SCREENS[id]; if (!s) return;
  const box = document.getElementById("screen");
  box.innerHTML = s.svg;
  s.hot.forEach(h => {
    const d = document.createElement("div");
    d.className = "hot";
    d.style.left = h.x+"px"; d.style.top = h.y+"px"; d.style.width = h.w+"px"; d.style.height = h.h+"px";
    d.title = h.b; d.onclick = () => show(h.t, true);
    box.appendChild(d);
  });
  document.getElementById("group").textContent = s.group;
  document.getElementById("title").textContent = s.title;
  if (push && cur) order.push(cur);
  cur = id; fit();
}
function fit(){const st=document.getElementById("stage");
  const k=Math.min(st.clientWidth/1440, st.clientHeight/1024);
  document.getElementById("screen").style.transform="scale("+k+")";}
document.getElementById("back").onclick=()=>{const p=order.pop(); if(p) show(p,false);};
document.getElementById("restart").onclick=()=>{order=[];cur=null;show("A01",false);};
window.addEventListener("resize", fit);
show("A01", false);
</script></body></html>
