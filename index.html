let order = [], cur = null;
function show(id, push) {
  const s = SCREENS[id]; if (!s) return;
  const box = document.getElementById("screen");
  box.innerHTML = s.svg;
  s.hot.forEach(h => {
    const d = document.createElement("div");
    d.className = "hot";
    d.style.left = h.x+"px"; d.style.top = h.y+"px"; d.style.width = h.w+"px"; d.style.height = h.h+"px";
    d.title = h.b; d.onclick = () => show(h.t, true);
    box.appendChild(d);
  });
  document.getElementById("group").textContent = s.group;
  document.getElementById("title").textContent = s.title;
  if (push && cur) order.push(cur);
  cur = id; fit();
}
function fit(){const st=document.getElementById("stage");
  const k=Math.min(st.clientWidth/1440, st.clientHeight/1024);
  document.getElementById("screen").style.transform="scale("+k+")";}
document.getElementById("back").onclick=()=>{const p=order.pop(); if(p) show(p,false);};
document.getElementById("restart").onclick=()=>{order=[];cur=null;show("A01",false);};
document.getElementById("toA").onclick=()=>{order=[];cur=null;show("A01",false);};
document.getElementById("toB").onclick=()=>{order=[];cur=null;show("S01",false);};
window.addEventListener("resize", fit);
show("A01", false);
</script></body></html>
